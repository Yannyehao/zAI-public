<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1130" viewBox="0 0 1120 1130" role="img" aria-labelledby="title desc">
<title id="title">zAI 系统架构：学习、交易辅助、人工复核与运行支撑</title>
<desc id="desc">左侧文稿处理接全文与语义检索，录播另接 zclip；右侧行情经 zdownload 进入 zradar 并输出候选与归档。两条业务线输出供人复核；人工反馈不表示自动生成策略。底部展示 zgui、zai_shared 和 zboard 的支撑职责。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11262e"/><stop offset="1" stop-color="#07151d"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#66d9bc" stroke-width="1.7"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#8bbcff" stroke-width="1.7"/></marker>
</defs>
<rect width="1120" height="1130" rx="24" fill="url(#bg)"/>
<g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif"><text x="42" y="52" fill="#88e2c4" font-size="34" font-weight="700">zAI</text><text x="118" y="52" fill="#9ab9c3" font-size="18" font-weight="600">SYSTEM ARCHITECTURE</text><text x="42" y="103" fill="#f0f6f5" font-size="34" font-weight="700">从学习积累，到每日观察与复盘</text><text x="42" y="141" fill="#9ab3bf" font-size="22" font-weight="400">两条业务线 · 人在环 · 有记录的工程实践</text><rect x="36" y="174" width="514" height="571" rx="20" fill="#102732" stroke="#29434e"/><rect x="570" y="174" width="514" height="571" rx="20" fill="#102c2b" stroke="#2c4b46"/><text x="58" y="211" fill="#a8cfff" font-size="27" font-weight="700">01  学习与知识</text><text x="594" y="211" fill="#8ee3c7" font-size="27" font-weight="700">02  选股与交易辅助</text><text x="58" y="248" fill="#a4bac7" font-size="23" font-weight="400">私有文稿 / 录播</text><text x="594" y="248" fill="#a5bfb8" font-size="23" font-weight="400">行情终端 / 市场数据</text><rect x="72" y="278" width="450" height="91" rx="12" fill="#172f3b" stroke="#37505c"/><text x="92" y="313" fill="#8bbcff" font-size="26" font-weight="600">zpipeline · zdocs · ztxt</text><text x="92" y="346" fill="#b4c8cf" font-size="21" font-weight="400">资料同步 / 文稿组织 / 文本镜像</text><path d="M294 369V394" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#blue)"/><rect x="72" y="398" width="450" height="91" rx="12" fill="#172f3b" stroke="#37505c"/><text x="92" y="433" fill="#8bbcff" font-size="26" font-weight="600">zsearch · zrag</text><text x="92" y="466" fill="#b4c8cf" font-size="21" font-weight="400">全文搜索 / 本地向量化 / 来源问答</text><text x="88" y="529" fill="#91adc0" font-size="20" font-weight="400">另一条输入：私有录播</text><path d="M62 244H52V579H72" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#blue)"/><rect x="72" y="550" width="450" height="91" rx="12" fill="#172f3b" stroke="#37505c"/><text x="92" y="585" fill="#8bbcff" font-size="26" font-weight="600">zclip</text><text x="92" y="618" fill="#b4c8cf" font-size="21" font-weight="400">分阶段加工 / 人工审阅 / 产物验收</text><text x="88" y="694" fill="#b8cee0" font-size="23" font-weight="600">输出：来源入口 · 学习材料</text><path d="M294 489H538V709H294V744" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#blue)"/><path d="M294 641V667" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#blue)"/><rect x="604" y="278" width="450" height="91" rx="12" fill="#172f3b" stroke="#37505c"/><text x="624" y="313" fill="#8ee3c7" font-size="26" font-weight="600">zdownload</text><text x="624" y="346" fill="#b4c8cf" font-size="21" font-weight="400">盘后行情获取 / 运行状态</text><path d="M829 369V394" fill="none" stroke="#66d9bc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="604" y="398" width="450" height="91" rx="12" fill="#172f3b" stroke="#37505c"/><text x="624" y="433" fill="#8ee3c7" font-size="26" font-weight="600">zradar</text><text x="624" y="466" fill="#b4c8cf" font-size="21" font-weight="400">数据检查 / 扫描 / 版本化评估</text><path d="M829 489V505H714V522" fill="none" stroke="#66d9bc" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="604" y="522" width="218" height="115" rx="12" fill="#173832" stroke="#386153"/><rect x="836" y="522" width="218" height="115" rx="12" fill="#173832" stroke="#386153"/><text x="622" y="560" fill="#b5ebd9" font-size="25" font-weight="600">候选分析</text><text x="622" y="595" fill="#b1c9c0" font-size="20" font-weight="400">卡片 / 复盘页</text><text x="854" y="560" fill="#b5ebd9" font-size="25" font-weight="600">持续跟踪</text><text x="854" y="595" fill="#b1c9c0" font-size="20" font-weight="400">归档 / 状态链</text><path d="M714 637V653H1070V709H829V744" fill="none" stroke="#66d9bc" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M945 637V653H1070" fill="none" stroke="#66d9bc" stroke-width="2.5"/><text x="620" y="694" fill="#c0dace" font-size="23" font-weight="600">输出：观察清单 · 判断记录</text><path d="M294 745V769H560V790" fill="none" stroke="#8bbcff" stroke-width="2.5" marker-end="url(#blue)"/><path d="M829 745V769H560" fill="none" stroke="#66d9bc" stroke-width="2.5"/><rect x="170" y="794" width="780" height="118" rx="16" fill="#393125" stroke="#8e7445"/><text x="196" y="832" fill="#f1d598" font-size="28" font-weight="700">03  人工复核与实践</text><text x="196" y="867" fill="#eadbb9" font-size="24" font-weight="400">回看来源 · 看图判断 · 决策与复盘</text><text x="196" y="895" fill="#cbbd9c" font-size="20" font-weight="400">理解与反馈由人完成，不是自动从录播生成策略。</text><path d="M950 848H1098V442H1056" fill="none" stroke="#66d9bc" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="40" y="961" fill="#dbe7e9" font-size="26" font-weight="700">04  运行支撑与开发协作</text><rect x="36" y="980" width="1048" height="95" rx="14" fill="#172c35" stroke="#36505c"/><text x="58" y="1017" fill="#b6d7e4" font-size="26" font-weight="600">zgui</text><text x="58" y="1050" fill="#9fb6c0" font-size="20" font-weight="400">健康 / 诊断与恢复协作</text><text x="402" y="1017" fill="#b6d7e4" font-size="26" font-weight="600">zai_shared</text><text x="402" y="1050" fill="#9fb6c0" font-size="20" font-weight="400">启动 / 状态 / 共享基础能力</text><text x="785" y="1017" fill="#b6d7e4" font-size="26" font-weight="600">zboard</text><text x="785" y="1050" fill="#9fb6c0" font-size="20" font-weight="400">进度 / 记录 / 指标证据</text><text x="40" y="1110" fill="#8ea9b4" font-size="19" font-weight="400">实线：业务流向    虚线：人工反馈    底层：支撑职责，非逐项调用关系</text><path d="M829 505H945V522" fill="none" stroke="#66d9bc" stroke-width="2.5" marker-end="url(#arrow)"/></g></svg>
